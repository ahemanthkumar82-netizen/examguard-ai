<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>404 - Page Not Found</title>
<link rel="stylesheet" href="/static/darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(-45deg,#667eea,#764ba2,#f093fb,#4facfe);background-size:400% 400%;animation:gradient 15s ease infinite;padding:1.5rem}
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(30px);border-radius:30px;padding:3rem;width:100%;max-width:600px;box-shadow:0 30px 80px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2);text-align:center}
.error-code{font-size:8rem;font-weight:900;color:#fff;margin-bottom:1rem;animation:float 3s ease-in-out infinite}
h1{font-size:2.5rem;font-weight:900;color:#fff;margin-bottom:1rem}
p{color:rgba(255,255,255,0.9);font-size:1.2rem;margin-bottom:2rem;line-height:1.6}
.btn-group{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{padding:1rem 2rem;border-radius:15px;border:none;background:rgba(255,255,255,0.2);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.3s ease;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-3px);background:rgba(255,255,255,0.3);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2)}
</style>
</head>
<body>
<div class="card">
<div class="error-code">404</div>
<h1>Page Not Found</h1>
<p>Oops! The page you're looking for doesn't exist.<br/>It might have been moved or deleted.</p>
<div class="btn-group">
<a href="/" class="btn btn-primary">🏠 Go Home</a>
<a href="/dashboard/" class="btn">📊 Dashboard</a>
<a href="javascript:history.back()" class="btn">🔙 Go Back</a>
</div>
</div>
<script src="/static/darkmode.js"></script>
</body>
</html>
