<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ExamGuard - Reset Password</title>
<link rel="stylesheet" href="/static/darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(-45deg,#667eea,#764ba2,#f093fb,#4facfe);background-size:400% 400%;animation:gradient 15s ease infinite;padding:1.5rem}
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(30px);border-radius:30px;padding:3rem;width:100%;max-width:450px;box-shadow:0 30px 80px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2)}
.header{text-align:center;margin-bottom:2.5rem}
.icon{font-size:4rem;margin-bottom:1rem}
h1{font-size:2.5rem;font-weight:900;color:#fff;margin-bottom:0.5rem}
.subtitle{color:rgba(255,255,255,0.9);font-size:1.1rem}
.error-box{background:rgba(220,38,38,0.9);border:1px solid rgba(239,68,68,0.5);color:#fff;padding:1rem 1.2rem;border-radius:15px;margin-bottom:1.5rem;display:none}
.form{display:flex;flex-direction:column;gap:1.3rem}
.field{display:flex;flex-direction:column;gap:0.5rem}
label{color:rgba(255,255,255,0.95);font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em}
.password-wrapper{position:relative}
input{padding:1rem 1.2rem;border-radius:15px;border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.15);color:#fff;font-size:1rem;outline:0;transition:all 0.3s ease;width:100%}
input:focus{border-color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.2)}
input::placeholder{color:rgba(255,255,255,0.6)}
.password-toggle{position:absolute;right:0.9rem;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.2);border:none;color:#fff;cursor:pointer;font-size:1.2rem;padding:0.5rem;border-radius:10px}
.password-toggle:hover{background:rgba(255,255,255,0.35)}
.btn{margin-top:1rem;padding:1.1rem;border-radius:15px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all 0.3s ease;box-shadow:0 15px 40px rgba(102,126,234,0.4)}
.btn:hover{transform:translateY(-5px);box-shadow:0 20px 50px rgba(102,126,234,0.6)}
.btn:disabled{opacity:0.6;cursor:not-allowed}
</style>
</head>
<body>
<div class="card">
<div class="header">
<div class="icon">🔑</div>
<h1>Reset Password</h1>
<p class="subtitle">Enter your new password</p>
</div>

<div class="error-box" id="errorBox"></div>

<form class="form" id="resetForm">
<input type="hidden" id="token" value="{{ token }}"/>
<div class="field">
<label>🔒 New Password</label>
<div class="password-wrapper">
<input type="password" id="password" placeholder="Enter new password" required minlength="6"/>
<button type="button" class="password-toggle" id="togglePassword">👁️</button>
</div>
</div>
<div class="field">
<label>🔒 Confirm Password</label>
<div class="password-wrapper">
<input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6"/>
<button type="button" class="password-toggle" id="toggleConfirmPassword">👁️</button>
</div>
</div>
<button class="btn" type="submit" id="submitBtn">✅ Reset Password</button>
</form>
</div>

<script>
document.getElementById('togglePassword').addEventListener('click',function(){
const field=document.getElementById('password');
const type=field.getAttribute('type')==='password'?'text':'password';
field.setAttribute('type',type);
this.textContent=type==='password'?'👁️':'🙈';
});

document.getElementById('toggleConfirmPassword').addEventListener('click',function(){
const field=document.getElementById('confirmPassword');
const type=field.getAttribute('type')==='password'?'text':'password';
field.setAttribute('type',type);
this.textContent=type==='password'?'👁️':'🙈';
});

document.getElementById('resetForm').addEventListener('submit',async function(e){
e.preventDefault();
const btn=document.getElementById('submitBtn');
const errorBox=document.getElementById('errorBox');
errorBox.style.display='none';

const password=document.getElementById('password').value;
const confirmPassword=document.getElementById('confirmPassword').value;

if(password!==confirmPassword){
errorBox.textContent='❌ Passwords do not match!';
errorBox.style.display='block';
return;
}

btn.disabled=true;
btn.textContent='⏳ Resetting...';

const formData={
token:document.getElementById('token').value,
password:password
};

try{
const res=await fetch('/reset-password/submit/',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(formData)
});
const data=await res.json();
if(data.success){
alert('✅ Password reset successful! Redirecting to login...');
window.location.href='/';
}else{
errorBox.textContent='❌ '+(data.error||'Failed to reset password');
errorBox.style.display='block';
btn.disabled=false;
btn.textContent='✅ Reset Password';
}
}catch(err){
errorBox.textContent='❌ Server error. Please try again.';
errorBox.style.display='block';
btn.disabled=false;
btn.textContent='✅ Reset Password';
}
});
</script>
<script src="/static/darkmode.js"></script>
</body>
</html>
