<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ExamGuard - Monitoring</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<link rel="stylesheet" href="/static/darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.95)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(59,130,246,.3)}50%{box-shadow:0 0 40px rgba(59,130,246,.6)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
@keyframes cornerPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.1)}}
@keyframes ripple{0%{transform:scale(1);opacity:1}100%{transform:scale(2);opacity:0}}
@keyframes gazeBeam{0%{opacity:0;transform:scale(0.5)}50%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(-45deg,#0f172a,#1e1b4b,#312e81,#1e3a8a);background-size:400% 400%;animation:gradient 15s ease infinite;color:#f1f5f9;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:center;padding:1.2rem 2rem;background:rgba(30,41,59,.95);backdrop-filter:blur(20px);border-bottom:2px solid rgba(59,130,246,.3);position:sticky;top:0;z-index:100;animation:slideDown .6s ease-out;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.topbar::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#3b82f6,#6366f1,#8b5cf6,#6366f1,#3b82f6);background-size:200% 100%;animation:shimmer 3s linear infinite}
.time-display{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:flex;align-items:center;gap:.6rem;animation:glow 2s ease-in-out infinite}
.student-info{position:absolute;right:2rem;display:flex;flex-direction:column;align-items:flex-end;gap:.2rem;animation:fadeIn .8s ease-out .3s both}
.student-name{font-size:1rem;color:#cbd5e1;font-weight:600}
.reg-no{font-size:.85rem;color:#64748b;font-weight:500}
.logout-btn{position:absolute;left:2rem;padding:.65rem 1.4rem;border-radius:10px;border:none;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;cursor:pointer;font-weight:700;font-size:.95rem;transition:all .3s ease;animation:fadeIn .8s ease-out .3s both}
.logout-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(239,68,68,.4)}
.logout-btn:active{transform:translateY(0)}
.main{display:flex;flex-direction:column;gap:2rem;padding:2rem;max-width:1100px;margin:0 auto;width:100%;animation:fadeIn .8s ease-out .4s both}
.camera-panel{width:100%;display:flex;flex-direction:column;gap:1rem}
.camera-box{position:relative;border-radius:20px;overflow:hidden;border:3px solid rgba(59,130,246,.4);background:#000;width:100%;max-width:100%;aspect-ratio:4/3;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:scaleIn .8s ease-out .6s both}
.camera-box::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:18px;padding:3px;background:linear-gradient(135deg,#3b82f6,#8b5cf6,#3b82f6);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.6}
#video{width:100%;height:100%;display:block;object-fit:cover;transform:scaleX(-1)}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1)}
.camera-controls{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;animation:fadeIn .8s ease-out .8s both}
.camera-select{flex:1;min-width:220px;padding:.85rem 1.2rem;border-radius:12px;border:2px solid rgba(51,65,85,.8);background:rgba(30,41,59,.9);backdrop-filter:blur(10px);color:#f1f5f9;font-size:.9rem;cursor:pointer;outline:0;transition:all .3s ease;font-weight:600}
.camera-select:hover{border-color:#3b82f6;background:rgba(30,41,59,1)}
.camera-select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.status-badge{display:flex;align-items:center;gap:.6rem;padding:.75rem 1.2rem;border-radius:12px;font-size:.9rem;font-weight:700;transition:all .3s ease;backdrop-filter:blur(10px)}
.status-ok{background:rgba(5,46,22,.9);border:2px solid #166534;color:#4ade80;animation:pulse 2s ease-in-out infinite}
.status-warn{background:rgba(69,26,3,.9);border:2px solid #92400e;color:#fcd34d;animation:shake .5s ease-in-out}
.status-error{background:rgba(69,10,10,.9);border:2px solid #991b1b;color:#f87171;animation:shake .5s ease-in-out}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
.warning-counter{display:flex;align-items:center;gap:.6rem;padding:.75rem 1.2rem;border-radius:12px;font-size:.9rem;font-weight:700;background:rgba(30,41,59,.9);backdrop-filter:blur(10px);border:2px solid rgba(51,65,85,.8);color:#cbd5e1;transition:all .3s ease}
.warning-num{color:#f59e0b;font-weight:800;font-size:1.2rem}
.start-camera-btn{padding:1.2rem 2.5rem;border-radius:16px;border:none;background:linear-gradient(135deg,#10b981,#059669,#047857);background-size:200% 100%;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer;margin:2rem auto;display:block;width:fit-content;transition:all .3s ease;box-shadow:0 10px 30px rgba(16,185,129,.3);animation:scaleIn .8s ease-out 1s both;position:relative;overflow:hidden}
.start-camera-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .5s ease}
.start-camera-btn:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(16,185,129,.5);background-position:100% 0}
.start-camera-btn:hover::before{left:100%}
.start-camera-btn:active{transform:translateY(0)}
.alert-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:999;align-items:center;justify-content:center;animation:fadeIn .3s ease-out}
.alert-box{background:rgba(30,41,59,.98);backdrop-filter:blur(20px);border:3px solid #ef4444;border-radius:24px;padding:3rem;text-align:center;max-width:450px;width:90%;box-shadow:0 30px 80px rgba(0,0,0,.8);animation:scaleIn .4s ease-out;position:relative}
.alert-box::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ef4444,#dc2626,#ef4444);background-size:200% 100%;animation:shimmer 2s linear infinite;border-radius:24px 24px 0 0}
.alert-icon{font-size:4rem;margin-bottom:1.5rem;animation:shake .5s ease-in-out}
.alert-title{font-size:1.6rem;font-weight:800;color:#fca5a5;margin-bottom:1rem;text-shadow:0 2px 10px rgba(239,68,68,.5)}
.alert-msg{color:#fecaca;font-size:1.1rem;margin-bottom:1.5rem;font-weight:600;line-height:1.5}
.debug{position:fixed;bottom:10px;left:10px;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);color:#4ade80;padding:12px 16px;font-size:13px;font-family:'Courier New',monospace;border-radius:10px;max-width:350px;z-index:1000;border:1px solid rgba(74,222,128,.3);box-shadow:0 4px 20px rgba(0,0,0,.5)}
</style>
</head>
<body>

<div class="topbar">
<button class="logout-btn" onclick="logout()">🚪 Logout</button>
<div class="time-display">
<span>⏰</span>
<span id="timeDisplay">00:00:00</span>
</div>
<div class="student-info">
<span class="student-name">👤 {{ student.name }}</span>
<span class="reg-no">{{ student.register_no }}</span>
</div>
</div>

<div class="main">
<div class="camera-panel">
<div class="camera-box">
<video id="video" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>
</div>
<div class="camera-controls">
<select id="cameraSelect" class="camera-select"></select>
<div class="status-badge status-warn" id="statusBadge">
<div class="dot"></div>
<span id="statusText">📷 Click button to start</span>
</div>
<div class="warning-counter">
⚠️ Warnings: <span class="warning-num" id="warningCount">0/3</span>
</div>
</div>
</div>
</div>

<div class="alert-overlay" id="alertOverlay">
<div class="alert-box">
<div class="alert-icon">⚠️</div>
<div class="alert-title">Violation Detected!</div>
<div class="alert-msg" id="alertMsg"></div>
</div>
</div>

<div class="debug" id="debug">Loading...</div>

<audio id="alertSound" preload="auto">

<script>
let detectionInterval=null,lookDownStart=0,noFaceStart=0,currentStream=null,examStartTime=null,timeInterval=null,gazeWarningCount=0,gazeAwayStart=0,headTurnWarningCount=0;

function debug(msg){
console.log(msg);
document.getElementById('debug').textContent=msg;
}

function showCameraButton(){
const cameraPanel=document.querySelector('.camera-panel');
const btn=document.createElement('button');
btn.className='start-camera-btn';
btn.textContent='📷 Start Camera & Begin Exam';
btn.onclick=()=>{
btn.remove();
examStartTime=Date.now();
startTimer();
loadCameras();
};
cameraPanel.appendChild(btn);
}

function startTimer(){
timeInterval=setInterval(()=>{
const elapsed=Math.floor((Date.now()-examStartTime)/1000);
const hours=Math.floor(elapsed/3600);
const minutes=Math.floor((elapsed%3600)/60);
const seconds=elapsed%60;
document.getElementById('timeDisplay').textContent=`${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
},1000);
}

async function loadCameras(){
debug('Loading cameras...');
try{
const devices=await navigator.mediaDevices.enumerateDevices();
const cameras=devices.filter(d=>d.kind==='videoinput');
debug(`Found ${cameras.length} cameras`);
const select=document.getElementById('cameraSelect');
cameras.forEach((cam,i)=>{
const opt=document.createElement('option');
opt.value=cam.deviceId;
opt.textContent='📷 '+(cam.label||`Camera ${i+1}`);
select.appendChild(opt);
});
if(cameras.length>0){
startCamera(cameras[0].deviceId);
select.addEventListener('change',()=>changeCamera(select.value));
}else{
debug('No cameras found!');
}
}catch(err){
debug('Camera error: '+err.message);
redirectToLogin('blocked');
}
}

async function startCamera(deviceId){
debug('Starting camera...');
try{
if(currentStream)currentStream.getTracks().forEach(t=>t.stop());
const stream=await navigator.mediaDevices.getUserMedia({
video:{
deviceId:deviceId?{exact:deviceId}:undefined,
width:{ideal:1280},
height:{ideal:720}
}
});
currentStream=stream;
const video=document.getElementById('video');
video.srcObject=stream;
video.onloadedmetadata=()=>{
debug('Video loaded, setting up canvas...');
const canvas=document.getElementById('overlay');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
debug(`Canvas: ${canvas.width}x${canvas.height}`);
loadFaceAPI();
};
stream.getVideoTracks()[0].addEventListener('ended',()=>{
debug('Camera stream ended');
redirectToLogin('blocked');
});
}catch(err){
debug('Start camera error: '+err.message);
redirectToLogin('blocked');
}
}

function changeCamera(deviceId){
if(detectionInterval)clearInterval(detectionInterval);
startCamera(deviceId);
}

function loadFaceAPI(){
debug('Checking face-api.js...');
if(typeof faceapi !== 'undefined'){
debug('face-api.js loaded, starting detection...');
startDetection();
}else{
debug('Waiting for face-api.js...');
setTimeout(loadFaceAPI,500);
}
}

async function startDetection(){
try{
debug('Loading models...');
const MODEL_URL='https://justadudewhohacks.github.io/face-api.js/models';
await Promise.all([
faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL)
]);
debug('Models loaded! Starting detection loop...');
setStatus('ok','✅ Detection active');
detectLoop();
}catch(err){
debug('Model load error: '+err.message);
setStatus('error','❌ Detection failed');
}
}

async function detectLoop(){
try{
const video=document.getElementById('video');
const canvas=document.getElementById('overlay');
const ctx=canvas.getContext('2d');

// Optimized for all body types, genders, glasses, and accessories
const detections=await faceapi.detectAllFaces(video,new faceapi.TinyFaceDetectorOptions({
inputSize:224,
scoreThreshold:0.4  // Lower threshold = better detection for all face types
})).withFaceLandmarks(true);

ctx.clearRect(0,0,canvas.width,canvas.height);

debug(`Faces detected: ${detections.length}`);

// Rule 1: Multiple faces
if(detections.length>1){
debug('VIOLATION: Multiple faces!');
showAlert('👥 Multiple persons detected!');
setTimeout(()=>redirectToLogin('multiple'),2000);
return;
}

// Rule 2: No face detected - with warning system
if(detections.length===0){
if(noFaceStart===0)noFaceStart=Date.now();
const elapsed=(Date.now()-noFaceStart)/1000;
debug(`No face: ${elapsed.toFixed(1)}s`);
if(elapsed>=3){
debug('WARNING: No face >3s!');
showAlert('👁️ Warning: Please keep your face visible in the camera!');
playSound();
setTimeout(()=>{
document.getElementById('alertOverlay').style.display='none';
},2000);
noFaceStart=0; // Reset timer after warning
}
setStatus('warn',`⚠️ No face (${elapsed.toFixed(1)}s)`);
ctx.strokeStyle='#ef4444';
ctx.lineWidth=4;
ctx.strokeRect(10,10,canvas.width-20,canvas.height-20);
}else{
noFaceStart=0;
const detection=detections[0];
const box=detection.detection.box;

// Draw green box that follows the face - no out of box detection
ctx.strokeStyle='#4ade80';
ctx.lineWidth=3;
ctx.strokeRect(box.x,box.y,box.width,box.height);

// Removed out of box detection - box follows user movement
// Users can move freely within camera view

const landmarks=detection.landmarks.positions;
const nose=landmarks[30];
const chin=landmarks[8];
const eyeLeft=landmarks[36];
const eyeRight=landmarks[45];
const leftEyeCenter=landmarks[39];
const rightEyeCenter=landmarks[42];
const eyeY=(eyeLeft.y+eyeRight.y)/2;

// Draw face tracker
drawFaceTracker(landmarks,ctx);
drawEyeTracker(leftEyeCenter,rightEyeCenter,nose,ctx);

// Rule 3: Eye Gaze Tracking - Check if looking at screen
const isLookingAtScreen=checkGazeDirection(landmarks,canvas);

if(!isLookingAtScreen){
if(gazeAwayStart===0)gazeAwayStart=Date.now();
const elapsed=(Date.now()-gazeAwayStart)/1000;

if(elapsed>=2){
gazeWarningCount+=1;
document.getElementById('warningCount').textContent=gazeWarningCount+'/3';
debug(`GAZE WARNING ${gazeWarningCount}/3: Looking away from screen!`);

if(gazeWarningCount>=3){
showAlert('⚠️ Warning 3/3: Looking away from screen! Exam terminated.');
setTimeout(()=>redirectToLogin('gaze_away'),2000);
return;
}else{
playSound();
showAlert(`⚠️ Warning ${gazeWarningCount}/3: Keep your eyes on the screen!`);
setTimeout(()=>{
document.getElementById('alertOverlay').style.display='none';
},2000);
setStatus('warn',`⚠️ Warning ${gazeWarningCount}/3: Eyes off screen`);
gazeAwayStart=0;
}
}else{
setStatus('warn',`⚠️ Eyes off screen (${elapsed.toFixed(1)}s)`);
}
}else{
gazeAwayStart=0;
}

// Rule 4: Head turn detection with 3 warning system
const faceWidth=Math.abs(landmarks[16].x-landmarks[0].x);
const headTurnThreshold=faceWidth*0.25;
const noseToCenterX=Math.abs(nose.x-(landmarks[0].x+landmarks[16].x)/2);

if(noseToCenterX>headTurnThreshold){
headTurnWarningCount+=1;
document.getElementById('warningCount').textContent=headTurnWarningCount+'/3';
debug(`HEAD TURN WARNING ${headTurnWarningCount}/3: Head turned!`);

if(headTurnWarningCount>=3){
showAlert('⚠️ Warning 3/3: Head turned! Exam terminated.');
setTimeout(()=>redirectToLogin('headturn'),2000);
return;
}else{
playSound();
showAlert(`⚠️ Warning ${headTurnWarningCount}/3: Keep your head facing the camera!`);
setTimeout(()=>{
document.getElementById('alertOverlay').style.display='none';
},2000);
setStatus('warn',`⚠️ Warning ${headTurnWarningCount}/3: Head turned`);
// Don't return, continue detection
}
}

// Rule 5: Looking down - VERY strict detection with warning system
// Only trigger if head is EXTREMELY tilted down (looking at desk/floor)
const noseToEyeDistance=nose.y-eyeY;
const chinToNoseDistance=chin.y-nose.y;

// Looking VERY down is only when:
// 1. Nose is VERY far below eyes (head severely tilted down)
// 2. Chin is MUCH further below nose (extreme downward angle like looking at desk)
// 3. Both conditions must be met simultaneously
const lookingVeryDown=noseToEyeDistance>50&&chinToNoseDistance>60;

if(lookingVeryDown){
if(lookDownStart===0)lookDownStart=Date.now();
const elapsed=(Date.now()-lookDownStart)/1000;
debug(`Looking VERY down: ${elapsed.toFixed(1)}s`);
if(elapsed>=5){
debug('WARNING: Looking VERY down >5s!');
showAlert('⏱️ Warning: Please keep your eyes on the screen!');
playSound();
setTimeout(()=>{
document.getElementById('alertOverlay').style.display='none';
},2000);
lookDownStart=0; // Reset timer after warning
}
setStatus('warn',`⚠️ Looking very down (${elapsed.toFixed(1)}s)`);
}else{
lookDownStart=0;
}

// Rule 6: Sleep detection (Eye Aspect Ratio)
const leftEyeHeight=Math.abs(landmarks[41].y-landmarks[37].y);
const rightEyeHeight=Math.abs(landmarks[47].y-landmarks[43].y);
const avgEyeHeight=(leftEyeHeight+rightEyeHeight)/2;

// Threshold: 2.5 pixels
// Open eyes: 5-10 pixels, Closed eyes: <2.5 pixels
if(avgEyeHeight<2.5){
debug('VIOLATION: Sleep detected!');
playSound();
showAlert('😴 Sleep/drowsiness detected!');
setTimeout(()=>redirectToLogin('sleep'),2000);
return;
}

setStatus('ok','✅ All good');
debug('All checks passed');
}

detectionInterval=setTimeout(detectLoop,100);
}catch(err){
debug('Detection error: '+err.message);
detectionInterval=setTimeout(detectLoop,100);
}
}

function setStatus(type,text){
const badge=document.getElementById('statusBadge');
badge.className='status-badge status-'+type;
document.getElementById('statusText').textContent=text;
}

function playSound(){
document.getElementById('alertSound').play().catch(()=>{});
}

function showAlert(message){
document.getElementById('alertMsg').textContent=message;
document.getElementById('alertOverlay').style.display='flex';
playSound();
}

function drawFaceTracker(landmarks,ctx){
// Draw animated scanning effect
const box={x:landmarks[0].x,y:landmarks[0].y,width:landmarks[16].x-landmarks[0].x,height:landmarks[8].y-landmarks[0].y};

// Animated corner brackets
const cornerSize=30;
const cornerThickness=4;
ctx.strokeStyle='#22c55e';
ctx.lineWidth=cornerThickness;
ctx.shadowColor='#22c55e';
ctx.shadowBlur=15;

// Top-left corner
ctx.beginPath();
ctx.moveTo(box.x,box.y+cornerSize);
ctx.lineTo(box.x,box.y);
ctx.lineTo(box.x+cornerSize,box.y);
ctx.stroke();

// Top-right corner
ctx.beginPath();
ctx.moveTo(box.x+box.width-cornerSize,box.y);
ctx.lineTo(box.x+box.width,box.y);
ctx.lineTo(box.x+box.width,box.y+cornerSize);
ctx.stroke();

// Bottom-left corner
ctx.beginPath();
ctx.moveTo(box.x,box.y+box.height-cornerSize);
ctx.lineTo(box.x,box.y+box.height);
ctx.lineTo(box.x+cornerSize,box.y+box.height);
ctx.stroke();

// Bottom-right corner
ctx.beginPath();
ctx.moveTo(box.x+box.width-cornerSize,box.y+box.height);
ctx.lineTo(box.x+box.width,box.y+box.height);
ctx.lineTo(box.x+box.width,box.y+box.height-cornerSize);
ctx.stroke();

ctx.shadowBlur=0;

// Draw face mesh with gradient
const gradient=ctx.createLinearGradient(box.x,box.y,box.x+box.width,box.y+box.height);
gradient.addColorStop(0,'rgba(34,197,94,0.3)');
gradient.addColorStop(1,'rgba(59,130,246,0.3)');
ctx.strokeStyle=gradient;
ctx.lineWidth=2;

// Face outline
for(let i=0;i<16;i++){
const p1=landmarks[i];
const p2=landmarks[i+1];
ctx.beginPath();
ctx.moveTo(p1.x,p1.y);
ctx.lineTo(p2.x,p2.y);
ctx.stroke();
}

// Key facial points with glow
const keyPoints=[30,8,36,45,48,54];
ctx.shadowColor='#22c55e';
ctx.shadowBlur=10;
keyPoints.forEach(i=>{
const p=landmarks[i];
const gradient=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,8);
gradient.addColorStop(0,'rgba(34,197,94,1)');
gradient.addColorStop(1,'rgba(34,197,94,0)');
ctx.fillStyle=gradient;
ctx.beginPath();
ctx.arc(p.x,p.y,8,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#fff';
ctx.beginPath();
ctx.arc(p.x,p.y,3,0,Math.PI*2);
ctx.fill();
});
ctx.shadowBlur=0;

// Add scanning line effect
const scanY=box.y+(Date.now()%2000)/2000*box.height;
const scanGradient=ctx.createLinearGradient(box.x,scanY-20,box.x,scanY+20);
scanGradient.addColorStop(0,'rgba(34,197,94,0)');
scanGradient.addColorStop(0.5,'rgba(34,197,94,0.6)');
scanGradient.addColorStop(1,'rgba(34,197,94,0)');
ctx.fillStyle=scanGradient;
ctx.fillRect(box.x,scanY-20,box.width,40);
}

function drawEyeTracker(leftEye,rightEye,nose,ctx){
// Draw eye circles with animated glow
const eyeRadius=10;
const glowIntensity=Math.sin(Date.now()/500)*0.3+0.7;

// Left eye with pulsing glow
const leftGradient=ctx.createRadialGradient(leftEye.x,leftEye.y,0,leftEye.x,leftEye.y,eyeRadius*2);
leftGradient.addColorStop(0,'rgba(59,130,246,'+glowIntensity+')');
leftGradient.addColorStop(0.5,'rgba(59,130,246,0.5)');
leftGradient.addColorStop(1,'rgba(59,130,246,0)');
ctx.fillStyle=leftGradient;
ctx.beginPath();
ctx.arc(leftEye.x,leftEye.y,eyeRadius*2,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='#3b82f6';
ctx.shadowColor='#3b82f6';
ctx.shadowBlur=15;
ctx.beginPath();
ctx.arc(leftEye.x,leftEye.y,eyeRadius,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='#fff';
ctx.shadowBlur=0;
ctx.beginPath();
ctx.arc(leftEye.x,leftEye.y,4,0,Math.PI*2);
ctx.fill();

// Right eye with pulsing glow
const rightGradient=ctx.createRadialGradient(rightEye.x,rightEye.y,0,rightEye.x,rightEye.y,eyeRadius*2);
rightGradient.addColorStop(0,'rgba(59,130,246,'+glowIntensity+')');
rightGradient.addColorStop(0.5,'rgba(59,130,246,0.5)');
rightGradient.addColorStop(1,'rgba(59,130,246,0)');
ctx.fillStyle=rightGradient;
ctx.beginPath();
ctx.arc(rightEye.x,rightEye.y,eyeRadius*2,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='#3b82f6';
ctx.shadowColor='#3b82f6';
ctx.shadowBlur=15;
ctx.beginPath();
ctx.arc(rightEye.x,rightEye.y,eyeRadius,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='#fff';
ctx.shadowBlur=0;
ctx.beginPath();
ctx.arc(rightEye.x,rightEye.y,4,0,Math.PI*2);
ctx.fill();

// Draw gaze direction beam with particles
const gazeX=(leftEye.x+rightEye.x)/2;
const gazeY=(leftEye.y+rightEye.y)/2;
const dirX=nose.x-gazeX;
const dirY=nose.y-gazeY;
const length=Math.sqrt(dirX*dirX+dirY*dirY);
const normalX=dirX/length;
const normalY=dirY/length;

const gazeLength=200;
const endX=gazeX+normalX*gazeLength;
const endY=gazeY+normalY*gazeLength;

// Animated gaze beam
const beamGradient=ctx.createLinearGradient(gazeX,gazeY,endX,endY);
beamGradient.addColorStop(0,'rgba(59,130,246,0.9)');
beamGradient.addColorStop(0.5,'rgba(96,165,250,0.6)');
beamGradient.addColorStop(1,'rgba(59,130,246,0)');
ctx.strokeStyle=beamGradient;
ctx.lineWidth=5;
ctx.shadowColor='#3b82f6';
ctx.shadowBlur=20;
ctx.beginPath();
ctx.moveTo(gazeX,gazeY);
ctx.lineTo(endX,endY);
ctx.stroke();
ctx.shadowBlur=0;

// Draw particles along gaze line
for(let i=0;i<5;i++){
const t=(i/5)+((Date.now()%1000)/1000);
if(t>1)continue;
const px=gazeX+normalX*gazeLength*t;
const py=gazeY+normalY*gazeLength*t;
const particleSize=8*(1-t);
const particleGradient=ctx.createRadialGradient(px,py,0,px,py,particleSize);
particleGradient.addColorStop(0,'rgba(96,165,250,'+(1-t)+')');
particleGradient.addColorStop(1,'rgba(96,165,250,0)');
ctx.fillStyle=particleGradient;
ctx.beginPath();
ctx.arc(px,py,particleSize,0,Math.PI*2);
ctx.fill();
}

// Gaze target point with pulsing rings
const targetSize=12;
const pulseSize=targetSize+Math.sin(Date.now()/300)*5;

// Outer pulsing ring
const ringGradient=ctx.createRadialGradient(endX,endY,0,endX,endY,pulseSize);
ringGradient.addColorStop(0,'rgba(251,191,36,0)');
ringGradient.addColorStop(0.7,'rgba(251,191,36,0.5)');
ringGradient.addColorStop(1,'rgba(251,191,36,0)');
ctx.fillStyle=ringGradient;
ctx.beginPath();
ctx.arc(endX,endY,pulseSize,0,Math.PI*2);
ctx.fill();

// Target point
const targetGradient=ctx.createRadialGradient(endX,endY,0,endX,endY,targetSize);
targetGradient.addColorStop(0,'rgba(251,191,36,1)');
targetGradient.addColorStop(1,'rgba(251,191,36,0.5)');
ctx.fillStyle=targetGradient;
ctx.shadowColor='#fbbf24';
ctx.shadowBlur=20;
ctx.beginPath();
ctx.arc(endX,endY,targetSize,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='#fff';
ctx.shadowBlur=0;
ctx.beginPath();
ctx.arc(endX,endY,5,0,Math.PI*2);
ctx.fill();

// Crosshair on target
ctx.strokeStyle='#fff';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(endX-8,endY);
ctx.lineTo(endX+8,endY);
ctx.moveTo(endX,endY-8);
ctx.lineTo(endX,endY+8);
ctx.stroke();
}

function checkGazeDirection(landmarks,canvas){
try{
const leftEye=landmarks[39];
const rightEye=landmarks[42];
const nose=landmarks[30];
const leftEyeOuter=landmarks[36];
const rightEyeOuter=landmarks[45];

const eyeCenterX=(leftEye.x+rightEye.x)/2;
const eyeCenterY=(leftEye.y+rightEye.y)/2;

const gazeX=nose.x-eyeCenterX;
const gazeY=nose.y-eyeCenterY;

const faceWidth=Math.abs(rightEyeOuter.x-leftEyeOuter.x);

const normalizedGazeX=gazeX/faceWidth;
const normalizedGazeY=gazeY/faceWidth;

// More lenient thresholds - allow more natural viewing angles
const horizontalThreshold=0.6; // Increased from 0.4
const verticalThreshold=0.5;   // Increased from 0.3

const lookingAtScreen=Math.abs(normalizedGazeX)<horizontalThreshold&&Math.abs(normalizedGazeY)<verticalThreshold;

return lookingAtScreen;
}catch(error){
return true;
}
}

async function redirectToLogin(reason){
debug('Redirecting to login: '+reason);
if(detectionInterval)clearInterval(detectionInterval);
if(timeInterval)clearInterval(timeInterval);
if(currentStream)currentStream.getTracks().forEach(t=>t.stop());
await fetch('/violation/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})}).catch(()=>{});
await fetch('/logout/',{method:'POST',headers:{'Content-Type':'application/json'}}).catch(()=>{});
window.location.href='/?reason='+reason;
}

async function logout(){
debug('Logging out...');
if(detectionInterval)clearInterval(detectionInterval);
if(timeInterval)clearInterval(timeInterval);
if(currentStream)currentStream.getTracks().forEach(t=>t.stop());
await fetch('/logout/',{method:'POST',headers:{'Content-Type':'application/json'}}).catch(()=>{});
window.location.href='/';
}

debug('Page loaded, ready to start');
showCameraButton();
