<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ExamGuard</title>
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js" integrity="sha256-NMGF5PVJlLLWdBJmH9yBR1GN7w+1KuJBJJdMdLj1LRo=" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e1b4b);padding:1.5rem}
.card{background:#1e293b;border-radius:20px;padding:2.5rem;width:100%;max-width:480px;box-shadow:0 25px 60px rgba(0,0,0,.6);border:1px solid #334155}
.header{text-align:center;margin-bottom:2rem}
.icon{font-size:3rem;margin-bottom:.5rem}
h1{font-size:1.6rem;font-weight:700;color:#f1f5f9;margin-bottom:.4rem}
.subtitle{color:#94a3b8;font-size:.9rem}
.warning{background:#451a03;border:1px solid #92400e;color:#fcd34d;padding:.85rem 1rem;border-radius:10px;margin-bottom:1.2rem;font-size:.88rem;display:none}
.form{display:flex;flex-direction:column;gap:1rem}
.field{display:flex;flex-direction:column;gap:.35rem}
label{color:#94a3b8;font-size:.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
input{padding:.75rem 1rem;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:.95rem;outline:0}
input:focus{border-color:#3b82f6}
.btn{margin-top:.5rem;padding:.9rem;border-radius:10px;border:none;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(59,130,246,.3)}
.admin-link{display:block;text-align:center;margin-top:1.5rem;padding:.7rem;border-radius:8px;background:#1e293b;border:1px solid #334155;color:#10b981;text-decoration:none;font-size:.9rem;font-weight:600;transition:all .2s}
.admin-link:hover{background:#10b981;color:#fff;border-color:#10b981}
.password-wrapper{position:relative}
.password-toggle{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:1.2rem;padding:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.password-toggle:hover{color:#3b82f6}
.note{margin-top:1.5rem;text-align:center;color:#475569;font-size:.8rem;line-height:1.5}
</style>
</head>
<body>

<div class="page">
<div class="card">
<div class="header">
<div class="icon"></div>
<h1>ExamGuard</h1>
<p class="subtitle">Enter your details to begin the exam</p>
</div>

<div class="warning" id="warningBox"></div>

<form class="form" id="loginForm">
<div class="field">
<label>👤 Full Name</label>
<input type="text" id="name" required/>
</div>
<div class="field">
<label>📱 Phone Number</label>
<input type="tel" id="phone" pattern="[0-9]{10}" required/>
</div>
<div class="field">
<label>📧 Email ID</label>
<input type="email" id="email" required/>
</div>
<div class="field">
<label>🏫 College Name</label>
<input type="text" id="college" required/>
</div>
<div class="field">
<label>🪪 Register Number</label>
<input type="text" id="regno" required/>
</div>
<button class="btn" type="submit">🚀 Start Exam</button>
</form>

<p class="note">📷 Your webcam will be monitored throughout the exam.<br/>Any violation will immediately end your session.</p>

<a href="/admin" class="admin-link">🔐 Admin Panel</a>
</div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
const reason=params.get('reason');
if(reason){
const reasons={
face:'⚠️ Camera blocked or face hidden',
multiple:'⚠️ Multiple persons detected',
sleep:'⚠️ Sleep/drowsiness detected',
lookdown:'⚠️ Looked down >2 seconds',
outofbox:'⚠️ Head turned outside camera',
headturn:'⚠️ Head turned outside camera',
blocked:'⚠️ Camera blocked or hidden'
};
const safeMessage=reasons[reason];
if(safeMessage){
document.getElementById('warningBox').textContent=safeMessage;
document.getElementById('warningBox').style.display='block';
}
}

document.getElementById('loginForm').addEventListener('submit',async function(e){
e.preventDefault();
const formData={
name:document.getElementById('name').value,
phone:document.getElementById('phone').value,
email:document.getElementById('email').value,
college:document.getElementById('college').value,
regno:document.getElementById('regno').value
};

const csrfToken=document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith('csrftoken='))?.split('=')[1]||'';
try{
const res=await fetch('/api/login/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrfToken},body:JSON.stringify(formData)});
const data=await res.json();
if(data.success){
window.location.href='/exam/';
}else{
alert('Login failed: '+data.error);
}
}catch(err){
console.error('Login error:',err);
alert('Server error. Please make sure the server is running.');
}
});
</script>
</body>
</html>
