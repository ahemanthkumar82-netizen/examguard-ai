<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Link Expired</title>
<link rel="stylesheet" href="/static/darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(-45deg,#f59e0b,#d97706);padding:1.5rem}
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(30px);border-radius:30px;padding:3rem;max-width:500px;text-align:center;color:#fff}
.icon{font-size:5rem;margin-bottom:1rem}
h1{font-size:2.5rem;margin-bottom:1rem}
p{font-size:1.1rem;margin-bottom:2rem;opacity:0.9}
.btn{padding:1rem 2rem;border-radius:15px;background:#fff;color:#d97706;font-weight:700;text-decoration:none;display:inline-block;margin:0.5rem}
</style>
</head>
<body>
<div class="card">
<div class="icon">⏰</div>
<h1>Link Expired</h1>
<p>This password reset link has expired or is invalid.<br/>Please request a new one.</p>
<a href="/forgot-password/" class="btn">Request New Link</a>
<a href="/" class="btn">Go to Login</a>
</div>
<script src="/static/darkmode.js"></script>
</body>
</html>
