<!DOCTYPE html>
<html>
<head>
    <title>ExamGuard - Backend Test</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #0f172a; color: white; }
        .test { background: #1e293b; padding: 20px; margin: 10px 0; border-radius: 10px; }
        .success { border-left: 4px solid #10b981; }
        .error { border-left: 4px solid #ef4444; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #2563eb; }
        pre { background: #0f172a; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>ExamGuard - Backend Test</h1>
    
    <div class="test">
        <h3>Test 1: Server Connection</h3>
        <button onclick="testConnection()">Test Connection</button>
        <div id="test1"></div>
    </div>
    
    <div class="test">
        <h3>Test 2: Student Login</h3>
        <button onclick="testLogin()">Test Login</button>
        <div id="test2"></div>
    </div>
    
    <div class="test">
        <h3>Test 3: Session Check</h3>
        <button onclick="testSession()">Test Session</button>
        <div id="test3"></div>
    </div>
    
    <div class="test">
        <h3>Test 4: Logout</h3>
        <button onclick="testLogout()">Test Logout</button>
        <div id="test4"></div>
    </div>

    <script>
        async function testConnection() {
            const result = document.getElementById('test1');
            result.innerHTML = '⏳ Testing...';
            try {
                const res = await fetch('/');
                if (res.ok) {
                    result.innerHTML = '<div class="success">✅ Server is running!</div>';
                } else {
                    result.innerHTML = '<div class="error">❌ Server error: ' + res.status + '</div>';
                }
            } catch (err) {
                result.innerHTML = '<div class="error">❌ Connection failed: ' + err.message + '</div>';
            }
        }

        async function testLogin() {
            const result = document.getElementById('test2');
            result.innerHTML = '⏳ Testing login...';
            try {
                const res = await fetch('/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'Test Student',
                        phone: '1234567890',
                        email: 'test@test.com',
                        college: 'Test College',
                        regno: 'TEST' + Date.now()
                    })
                });
                const data = await res.json();
                if (data.success) {
                    result.innerHTML = '<div class="success">✅ Login successful!<pre>' + JSON.stringify(data, null, 2) + '</pre></div>';
                } else {
                    result.innerHTML = '<div class="error">❌ Login failed: ' + data.error + '</div>';
                }
            } catch (err) {
                result.innerHTML = '<div class="error">❌ Error: ' + err.message + '</div>';
            }
        }

        async function testSession() {
            const result = document.getElementById('test3');
            result.innerHTML = '⏳ Checking session...';
            try {
                const res = await fetch('/session/');
                const data = await res.json();
                if (res.ok) {
                    result.innerHTML = '<div class="success">✅ Session active!<pre>' + JSON.stringify(data, null, 2) + '</pre></div>';
                } else {
                    result.innerHTML = '<div class="error">❌ No active session</div>';
                }
            } catch (err) {
                result.innerHTML = '<div class="error">❌ Error: ' + err.message + '</div>';
            }
        }

        async function testLogout() {
            const result = document.getElementById('test4');
            result.innerHTML = '⏳ Logging out...';
            try {
                const res = await fetch('/logout/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (data.success) {
                    result.innerHTML = '<div class="success">✅ Logout successful!</div>';
                } else {
                    result.innerHTML = '<div class="error">❌ Logout failed</div>';
                }
            } catch (err) {
                result.innerHTML = '<div class="error">❌ Error: ' + err.message + '</div>';
            }
        }
    </script>
</body>
</html>
