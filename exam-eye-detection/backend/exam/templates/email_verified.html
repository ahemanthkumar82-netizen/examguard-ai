<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Email Verified - ExamGuard</title>
<link rel="stylesheet" href="/static/darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(-45deg,#10b981,#059669,#34d399,#6ee7b7);background-size:400% 400%;animation:gradient 15s ease infinite;padding:1.5rem}
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(30px);border-radius:30px;padding:3rem;width:100%;max-width:500px;box-shadow:0 30px 80px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2);text-align:center}
.icon{font-size:5rem;margin-bottom:1rem}
h1{font-size:2.5rem;font-weight:900;color:#fff;margin-bottom:1rem}
p{color:rgba(255,255,255,0.9);font-size:1.1rem;margin-bottom:2rem;line-height:1.6}
.btn{padding:1rem 2rem;border-radius:15px;border:none;background:rgba(255,255,255,0.9);color:#059669;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all 0.3s ease;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
</style>
</head>
<body>
<div class="card">
<div class="icon">✅</div>
<h1>Email Verified!</h1>
<p>Congratulations {{ student.name }}!<br/>Your email has been successfully verified.<br/>You can now login and start taking exams.</p>
<a href="/" class="btn">🚀 Go to Login</a>
</div>
<script src="/static/darkmode.js"></script>
</body>
</html>
