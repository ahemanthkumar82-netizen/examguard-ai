<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ExamGuard - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(168,85,247,.4)}50%{box-shadow:0 0 40px rgba(168,85,247,.8)}}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;background:#070018;color:#fff;overflow-x:hidden;position:relative;display:flex;align-items:center;justify-content:center;padding:2rem}
body::before{content:'';position:absolute;width:100%;height:100%;background:radial-gradient(circle at 20% 50%,rgba(168,85,247,.15),transparent 50%),radial-gradient(circle at 80% 50%,rgba(236,72,153,.15),transparent 50%);animation:gradient 15s ease infinite;pointer-events:none}
.container{background:rgba(15,15,35,.8);backdrop-filter:blur(20px);border-radius:30px;padding:3rem;width:100%;max-width:450px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(168,85,247,.2);border:1px solid rgba(168,85,247,.3);position:relative;z-index:1}
.container::before{content:'';position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;background:linear-gradient(45deg,#a855f7,#ec4899,#a855f7);border-radius:30px;z-index:-1;opacity:.3;filter:blur(10px)}
.header{text-align:center;margin-bottom:2.5rem}
.icon{font-size:4rem;margin-bottom:1rem;animation:float 3s ease-in-out infinite}
.header h1{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem}
.header p{color:#9ca3af;font-size:1rem}
.error-box{background:rgba(220,38,38,.2);border:1px solid rgba(239,68,68,.5);color:#fca5a5;padding:.9rem 1rem;border-radius:10px;margin-bottom:1.2rem;font-size:.88rem;display:none}
.input-group{margin-bottom:1.5rem}
.input-group label{display:block;color:#d1d5db;font-size:.9rem;font-weight:600;margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.05em}
.input-wrapper{position:relative}
.input-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:1.2rem;color:#a855f7}
.input-wrapper input{width:100%;padding:1rem 1rem 1rem 3rem;background:rgba(15,15,35,.9);border:2px solid rgba(168,85,247,.3);border-radius:12px;color:#fff;font-size:.95rem;outline:0;transition:all .3s ease}
.input-wrapper input:focus{border-color:#a855f7;box-shadow:0 0 20px rgba(168,85,247,.3);background:rgba(15,15,35,1)}
.input-wrapper input::placeholder{color:#6b7280}
.password-toggle{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#9ca3af;cursor:pointer;font-size:1.2rem;padding:5px;transition:color .3s}
.password-toggle:hover{color:#a855f7}
.options{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.checkbox-group{display:flex;align-items:center;gap:.5rem}
.checkbox-group input[type="checkbox"]{width:18px;height:18px;accent-color:#a855f7;cursor:pointer}
.checkbox-group label{color:#9ca3af;font-size:.85rem;cursor:pointer;margin:0;text-transform:none;letter-spacing:normal}
.forgot-link{color:#a855f7;font-size:.85rem;text-decoration:none;transition:color .3s}
.forgot-link:hover{color:#ec4899}
.btn{width:100%;padding:1.1rem;background:linear-gradient(135deg,#a855f7,#ec4899);border:none;border-radius:12px;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;transition:all .3s ease;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(168,85,247,.4)}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .5s ease}
.btn:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(168,85,247,.6)}
.btn:hover::before{left:100%}
.btn:active{transform:translateY(-1px)}
.divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:#6b7280;font-size:.85rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(168,85,247,.3),transparent)}
.register-link{text-align:center;color:#9ca3af;font-size:.9rem}
.register-link a{color:#a855f7;text-decoration:none;font-weight:600;transition:color .3s}
.register-link a:hover{color:#ec4899}
.admin-link{display:block;text-align:center;margin-top:1.5rem;padding:.8rem;border-radius:10px;background:rgba(15,15,35,.6);border:1px solid rgba(168,85,247,.3);color:#10b981;text-decoration:none;font-size:.9rem;font-weight:600;transition:all .3s}
.admin-link:hover{background:#10b981;color:#fff;border-color:#10b981;transform:translateY(-2px)}
</style>
</head>
<body>

<div class="container">
<div class="header">
<div class="icon">🔐</div>
<h1>Welcome Back</h1>
<p>Login to continue your exam</p>
</div>

<div class="error-box" id="errorBox"></div>

<form id="loginForm">
<div class="input-group">
<label>Register Number</label>
<div class="input-wrapper">
<span class="input-icon">🪪</span>
<input type="text" id="regno" placeholder="Enter your register number" required autofocus/>
</div>
</div>

<div class="input-group">
<label>Password</label>
<div class="input-wrapper">
<span class="input-icon">🔒</span>
<input type="password" id="password" placeholder="Enter your password" required/>
<button type="button" class="password-toggle" id="togglePassword">👁️</button>
</div>
</div>

<div class="options">
<div class="checkbox-group">
<input type="checkbox" id="rememberMe"/>
<label for="rememberMe">Remember me</label>
</div>
<a href="/forgot-password/" class="forgot-link">Forgot password?</a>
</div>

<button class="btn" type="submit">🚀 Login to Exam</button>
</form>

<div class="divider">OR</div>

<div class="register-link">
Don't have an account? <a href="/register/">Create Account</a>
</div>

<a href="/admin/" class="admin-link">🔐 Admin Panel</a>
</div>

<script>
// Password toggle
document.getElementById('togglePassword').addEventListener('click',function(){
const passwordField=document.getElementById('password');
const type=passwordField.getAttribute('type')==='password'?'text':'password';
passwordField.setAttribute('type',type);
this.textContent=type==='password'?'👁️':'🙈';
});

// Login form
document.getElementById('loginForm').addEventListener('submit',async function(e){
e.preventDefault();
const errorBox=document.getElementById('errorBox');
errorBox.style.display='none';

const formData={
regno:document.getElementById('regno').value.trim(),
password:document.getElementById('password').value
};

try{
const csrfToken=document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith('csrftoken='))?.split('=')[1]||'';
const res=await fetch('/api/login/',{
method:'POST',
headers:{'Content-Type':'application/json','X-CSRFToken':csrfToken},
body:JSON.stringify(formData)
});
const data=await res.json();
if(data.success){
window.location.href='/exam/';
}else{
errorBox.textContent='❌ '+(data.error||'Invalid credentials');
errorBox.style.display='block';
}
}catch(err){
errorBox.textContent='❌ Server error. Please try again.';
errorBox.style.display='block';
}
});

// Check for URL parameters (violation redirect)
const params=new URLSearchParams(window.location.search);
const reason=params.get('reason');
if(reason){
const reasons={
face:'⚠️ Camera blocked or face hidden',
multiple:'⚠️ Multiple persons detected',
sleep:'⚠️ Sleep/drowsiness detected',
lookdown:'⚠️ Looked down >2 seconds',
outofbox:'⚠️ Head turned outside camera',
headturn:'⚠️ Head turned outside camera',
blocked:'⚠️ Camera blocked or hidden',
gaze_away:'⚠️ Looking away from screen'
};
const safeMessage=reasons[reason];
if(safeMessage){
const errorBox=document.getElementById('errorBox');
errorBox.textContent=safeMessage;
errorBox.style.display='block';
}
}
</script>
</body>
</html>
