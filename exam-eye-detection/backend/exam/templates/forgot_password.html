<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ExamGuard - Forgot Password</title>
<link rel="stylesheet" href="/static/darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(-45deg,#667eea,#764ba2,#f093fb,#4facfe);background-size:400% 400%;animation:gradient 15s ease infinite;padding:1.5rem}
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(30px);border-radius:30px;padding:3rem;width:100%;max-width:450px;box-shadow:0 30px 80px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2)}
.header{text-align:center;margin-bottom:2.5rem}
.icon{font-size:4rem;margin-bottom:1rem}
h1{font-size:2.5rem;font-weight:900;color:#fff;margin-bottom:0.5rem}
.subtitle{color:rgba(255,255,255,0.9);font-size:1.1rem}
.success-box{background:rgba(16,185,129,0.9);border:1px solid rgba(52,211,153,0.5);color:#fff;padding:1rem 1.2rem;border-radius:15px;margin-bottom:1.5rem;display:none}
.error-box{background:rgba(220,38,38,0.9);border:1px solid rgba(239,68,68,0.5);color:#fff;padding:1rem 1.2rem;border-radius:15px;margin-bottom:1.5rem;display:none}
.form{display:flex;flex-direction:column;gap:1.3rem}
.field{display:flex;flex-direction:column;gap:0.5rem}
label{color:rgba(255,255,255,0.95);font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em}
input{padding:1rem 1.2rem;border-radius:15px;border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.15);color:#fff;font-size:1rem;outline:0;transition:all 0.3s ease}
input:focus{border-color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.2)}
input::placeholder{color:rgba(255,255,255,0.6)}
.btn{margin-top:1rem;padding:1.1rem;border-radius:15px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all 0.3s ease;box-shadow:0 15px 40px rgba(102,126,234,0.4)}
.btn:hover{transform:translateY(-5px);box-shadow:0 20px 50px rgba(102,126,234,0.6)}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.back-link{text-align:center;margin-top:1.5rem}
.back-link a{color:#fff;text-decoration:none;font-weight:700;font-size:1.05rem;padding:0.7rem 1.5rem;border-radius:12px;background:rgba(255,255,255,0.1);display:inline-block;transition:all 0.3s ease}
.back-link a:hover{background:rgba(255,255,255,0.2);transform:translateY(-3px)}
</style>
</head>
<body>
<div class="card">
<div class="header">
<div class="icon">🔒</div>
<h1>Forgot Password</h1>
<p class="subtitle">Enter your email to reset password</p>
</div>

<div class="success-box" id="successBox"></div>
<div class="error-box" id="errorBox"></div>

<form class="form" id="forgotForm">
<div class="field">
<label>📧 Email Address</label>
<input type="email" id="email" placeholder="Enter your registered email" required/>
</div>
<button class="btn" type="submit" id="submitBtn">📨 Send Reset Link</button>
</form>

<div class="back-link">
<a href="/">🔙 Back to Login</a>
</div>
</div>

<script>
document.getElementById('forgotForm').addEventListener('submit',async function(e){
e.preventDefault();
const btn=document.getElementById('submitBtn');
const errorBox=document.getElementById('errorBox');
const successBox=document.getElementById('successBox');
errorBox.style.display='none';
successBox.style.display='none';

btn.disabled=true;
btn.textContent='⏳ Sending...';

const formData={
email:document.getElementById('email').value.trim()
};

try{
const csrfToken=document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith('csrftoken='))?.split('=')[1]||'';
const res=await fetch('/forgot-password/send/',{
method:'POST',
headers:{'Content-Type':'application/json','X-CSRFToken':csrfToken},
body:JSON.stringify(formData)
});
const data=await res.json();
if(data.success){
successBox.textContent='✅ '+data.message;
successBox.style.display='block';
document.getElementById('email').value='';
btn.disabled=false;
btn.textContent='📨 Send Reset Link';
}else{
errorBox.textContent='❌ '+(data.error||'Failed to send reset link');
errorBox.style.display='block';
btn.disabled=false;
btn.textContent='📨 Send Reset Link';
}
}catch(err){
errorBox.textContent='❌ Server error. Please try again.';
errorBox.style.display='block';
btn.disabled=false;
btn.textContent='📨 Send Reset Link';
}
});
</script>
<script src="/static/darkmode.js"></script>
</body>
</html>
