<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>500 - Server Error</title>
<link rel="stylesheet" href="/static/darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(-45deg,#ef4444,#dc2626,#f87171,#fca5a5);background-size:400% 400%;animation:gradient 15s ease infinite;padding:1.5rem}
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(30px);border-radius:30px;padding:3rem;width:100%;max-width:600px;box-shadow:0 30px 80px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2);text-align:center}
.error-code{font-size:8rem;font-weight:900;color:#fff;margin-bottom:1rem;animation:shake 0.5s ease-in-out}
h1{font-size:2.5rem;font-weight:900;color:#fff;margin-bottom:1rem}
p{color:rgba(255,255,255,0.9);font-size:1.2rem;margin-bottom:2rem;line-height:1.6}
.btn-group{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{padding:1rem 2rem;border-radius:15px;border:none;background:rgba(255,255,255,0.2);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.3s ease;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-3px);background:rgba(255,255,255,0.3);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.btn-primary{background:rgba(255,255,255,0.9);color:#dc2626}
</style>
</head>
<body>
<div class="card">
<div class="error-code">500</div>
<h1>Server Error</h1>
<p>Something went wrong on our end.<br/>We're working to fix it. Please try again later.</p>
<div class="btn-group">
<a href="/" class="btn btn-primary">🏠 Go Home</a>
<a href="javascript:location.reload()" class="btn">🔄 Reload Page</a>
</div>
</div>
<script src="/static/darkmode.js"></script>
</body>
</html>
